<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar comida</title>

    <link rel="stylesheet" href="/app.css" />
    <script src="/add-meal.js" defer></script>
  </head>
  <body class="dialog-body">
    <section class="form-card">
      <h1>Comida</h1>

      <button id="add-recipe" type="button" class="primary">
        Añadir receta
      </button>
      <input id="recipe-search" hidden placeholder="Buscar receta..." />
      <div id="recipe-results" class="picker-results"></div>
      <div id="selected-recipes"></div>

      <button id="submit" type="button">Guardar comida</button>
    </section>
  </body>
</html>
